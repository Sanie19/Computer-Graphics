<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coffee Bar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15110e; font-family: Georgia, 'Times New Roman', serif; }
  #title { position: fixed; left: 24px; top: 20px; color: #f1e4d0; letter-spacing: .28em; text-transform: uppercase; font-size: 15px; text-shadow: 0 2px 10px #000; }
  #title small { display:block; margin-top:6px; letter-spacing:.12em; font-size:11px; opacity:.65; text-transform:none; font-style: italic; }
  #info { position: fixed; left: 24px; bottom: 16px; color: #e8dccb; font: 12px system-ui, sans-serif; opacity: .65; }
</style>
</head>
<body>
<div id="title">Cafe Nini<small>coffee bar</small></div>
<div id="info">Drag: orbit · Scroll: zoom · Right-drag: pan · Press R: auto-rotate</div>
<script type="module" src="/main.js"></script>
</body>
</html>
